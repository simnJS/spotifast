name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Dependencies come only from crates.io or from crmne repositories,
  # review evidence (captures, comparison pages, recordings) stays in the pull
  # request instead of the tree, and a pull request adds no setting without
  # the maintainer's approval. See CONTRIBUTING.md.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Dependency sources
        run: python3 .github/scripts/check-dependency-sources.py
      - name: No review evidence in the tree
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-review-evidence.py
      - name: Policy check regressions
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/test-policy-checks.py
      # Pull requests only: the maintainer's own commits on main are not
      # checked. The label is read when the job runs, so after adding
      # setting-approved, re-run this job.
      - name: New settings need approval
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          approved=()
          if grep -qx setting-approved <<< "$labels"; then approved=(--approved); fi
          python3 .github/scripts/check-new-settings.py --base "$BASE" "${approved[@]}"

  # Tests run on Linux and Windows x64, the two systems the fork ships. It
  # never tests on macOS or Windows on ARM. A change to the docs alone skips
  # the Rust lints. This job is not a required check, so a skipped one never
  # blocks a merge.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      platforms: ${{ steps.scope.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/ci-scope.py --repo "$GITHUB_REPOSITORY"
          --event "${{ github.event_name }}"
          --pr "${{ github.event.pull_request.number }}"
          --before "${{ github.event.before }}" --after "${{ github.sha }}"

  quality:
    name: quality
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libclang-dev ruby
      # After the toolchain, so the cache key follows the pinned rustc. The
      # key carries no job name, so each job sets its own generation. Only
      # pushes to main save; a pull request restores and builds on top.
      # Letting every branch save its own copy filled the repository's
      # ten-gigabyte cache in a few days, and a full cache evicts the entry
      # the next build wanted.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: quality-v1
      - name: Formatting
        run: cargo fmt --all --check
      - name: Linux launcher packaging regressions
        run: python3 packaging/test-launchers.py
      - name: Release name migration regressions
        run: python3 packaging/test-release-names.py
      - name: Clippy (default features)
        run: mbx clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        run: mbx clippy --locked --all-targets --all-features -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: mbx doc --locked --all-features --no-deps

  test:
    name: test (${{ matrix.os }})
    needs: scope
    runs-on: ${{ matrix.os }}
    # A cold mbx cache on Windows needs about 30 minutes before the action
    # saves the cache; warm runs take far less.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows x64 only: the fork ships no Windows on ARM build.
        os: ${{ fromJSON(needs.scope.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libclang-dev
      # dumpbin below inspects the finished binary, and the Soloist audio
      # build compiles C++ with the MSVC tools.
      # Native tools on each runner: the action's default is x64, which on
      # the arm64 runner would compile under emulation.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      # The demo feature carries the headless render test that lays out every
      # page, panel, and dialog without a display.
      # One pass with every feature: the default set is a subset, and a
      # second pass only recompiled the same crate for the same tests.
      - name: Tests (all features)
        run: mbx test --locked --all-targets --all-features
      - name: Native credential store (dummy grants)
        if: runner.os == 'Windows'
        # Switching feature sets can relink the test binary on a cold runner.
        timeout-minutes: 5
        run: mbx test --locked --lib credentials::tests::native_store_round_trip -- --ignored --exact
      - name: Documentation tests
        run: mbx test --locked --all-features --doc
      # A build can pass while importing Microsoft's C++ runtime, then fail on
      # a clean user's machine. Inspect the executable CI actually produced.
      - name: Standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mbx build --locked
          $imports = & dumpbin /dependents target\debug\spotifast.exe | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotifast imports an MSVC runtime:`n$runtime" }
          $machine = if ($env:RUNNER_ARCH -eq 'ARM64') { 'AA64 machine \(ARM64\)' } else { '8664 machine \(x64\)' }
          $headers = & dumpbin /headers target\debug\spotifast.exe | Out-String
          if ($headers -notmatch $machine) { throw "spotifast.exe is not built for $env:RUNNER_ARCH`:`n$headers" }

      - name: Windows installer syntax and renamed inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          & $iscc "/DVersion=$version" "/DArch=$arch" "/DBinary=$PWD\target\debug\spotifast.exe" "/DOutputDir=$env:RUNNER_TEMP\spotifast-installer-check" packaging\windows\spotifast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The Windows Installer package, which native-packages builds as the
      # release does (native-packages.yaml), from the executable built above.
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Windows'
        with:
          ruby-version: '4.0'
      - name: Windows Installer package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\wix" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          gem install native-packages --version 0.11.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $target, $id = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64-pc-windows-msvc', 'windows-arm64' } else { 'x86_64-pc-windows-msvc', 'windows-amd64' }
          $payload = "dist\msi-input-$target"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item target\debug\spotifast.exe, README.md, LICENSE, packaging\windows\spotifast-installer.txt $payload
          native-packages build --version $version --target $id --defer-recipes --output "$env:RUNNER_TEMP\spotifast-msi-check"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Installs, updates and removes throwaway copies of the package, with
      # an identity of their own: a running copy, a portable copy, and an
      # Inno Setup install it takes over (#766 and the updater's contract).
      - name: Windows Installer install, update and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          python packaging\windows\test-msi.py $iscc -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
