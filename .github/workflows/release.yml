name: Release

# The fork's release: Linux x86_64 (archive and AppImage) and Windows x64
# (zip and installer), with checksums.txt signed by the fork's own update
# key, published on the fork's GitHub Releases page. A v* tag publishes;
# running the workflow by hand is a dry run that builds, signs and uploads
# everything as a workflow artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the native packages' declared glibc 2.39 baseline.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package-target: windows-amd64
    steps:
      - uses: actions/checkout@v7
      # A tag names the release. A dry run names it after the crate, as the
      # tag for this commit would.
      - name: Release name
        shell: bash
        run: |
          v=$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$v"; fi
          # The binary reports the crate's version (#1080): refuse a tag that
          # names another one before spending the build minutes on it.
          if [ "${tag#v}" != "$v" ]; then
            echo "::error::tag $tag names ${tag#v}, but Cargo.toml says $v; bump the crate's version or retag"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the target's standard library
      # to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libclang-dev
      # dumpbin below, and the installer's custom actions, need the MSVC tools.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # No compiler cache: published binaries never build from outputs
      # restored from an Actions cache.
      - run: cargo build --locked --release --target ${{ matrix.target }}

      # The zip and installer must run on a clean Windows machine without a
      # separately installed Visual C++ redistributable.
      - name: Verify standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\spotifast.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotifast imports an MSVC runtime:`n$runtime" }
          # The updater picks its download by the running executable's
          # architecture.
          $headers = & dumpbin /headers $binary | Out-String
          if ($headers -notmatch '8664 machine \(x64\)') { throw "$binary is not built for x64:`n$headers" }
          $version = (& $binary --version | Out-String).Trim()
          if ($version -ne "spotifast $($env:TAG.TrimStart('v'))") { throw "The binary reports $version, but the release is $env:TAG" }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="spotifast-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/spotifast" "dist/$name/"
          cp README.md LICENSE packaging/spotifast-portable.txt "dist/$name/"
          # Desktop integration for package builds and hand-installs.
          cp --parents packaging/applications/spotifast.desktop packaging/icons/spotifast.svg "dist/$name/"
          cp --parents contrib/omarchy/spotifast.json.tpl contrib/omarchy/spotifast-theme "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="spotifast-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/spotifast.exe" "dist/$name/"
          cp README.md LICENSE packaging/spotifast-portable.txt "dist/$name/"
          cd dist
          7z a "$name.zip" "$name"

      # native-packages builds the AppImage from the archive above and the
      # Windows Installer package from the binary. Without the Azure signing
      # variables it leaves the Windows code unsigned.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native-packages
        run: gem install native-packages --version 0.11.0 --no-document

      # checksums.txt lists the AppImage with its .zsync file and the
      # signature covers both, so the app replaces an AppImage only with a
      # signed one. Stable releases only.
      - name: AppImage
        if: runner.os == 'Linux' && !contains(env.TAG, '-')
        run: |
          sudo apt-get install -y --no-install-recommends libarchive-tools squashfs-tools zsync
          native-packages build --version "${TAG#v}" --target appimage-amd64 --defer-recipes \
            --output "$RUNNER_TEMP/appimage"
          cp "$RUNNER_TEMP/appimage/packages/appimage-amd64/appimage/"*.AppImage \
            "$RUNNER_TEMP/appimage/packages/appimage-amd64/appimage/"*.AppImage.zsync dist/

      # The Windows installer (PACKAGING.md, "Windows Installer package").
      - name: Windows Installer package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          $version = $env:TAG.TrimStart("v")
          $payload = "dist\msi-input-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $payload | Out-Null
          $files = "target\${{ matrix.target }}\release\spotifast.exe", "README.md", "LICENSE", "packaging\windows\spotifast-installer.txt"
          Copy-Item $files $payload
          $packages = "$env:RUNNER_TEMP\windows-packages"
          native-packages build --version $version --target ${{ matrix.package-target }} --defer-recipes --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$packages\packages\${{ matrix.package-target }}\msi\*.msi" dist\

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release name
        run: |
          v=$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$v"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # Refuse a release without its written notes before signing anything.
      - name: Release notes
        run: test -s "packaging/release-notes/$TAG.md"
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # The source package, so source builds can verify it against the same
      # signed checksums as the binaries. A dry run has no tag to fetch.
      - name: Source archive
        if: github.ref_type == 'tag'
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz" \
            --output "dist/spotifast-${TAG}-source.tar.gz"
      - name: Public filenames, updater compatibility and checksums
        run: python3 packaging/release-names.py dist "$TAG"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      # Sign the manifest release-names.py wrote (checksums.txt.sig), then
      # check the signature and every listed file against the committed key.
      # The app refuses releases without a valid signature.
      - name: Sign checksums
        env:
          SPOTIFAST_UPDATE_SIGNING_KEY: ${{ secrets.SPOTIFAST_UPDATE_SIGNING_KEY }}
        run: |
          gem install native-packages --version 0.11.0 --no-document
          native-packages sign-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex \
            --key-env SPOTIFAST_UPDATE_SIGNING_KEY
          native-packages verify-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex
      - name: Dry run result
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.TAG }}
          path: dist/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist/*
          name: Spotifast ${{ env.TAG }}
          body_path: packaging/release-notes/${{ env.TAG }}.md
          generate_release_notes: false
          # A tag with a suffix (v0.18.0-rc1) is a pre-release: it stays off
          # "latest", so the app's update check never offers it.
          prerelease: ${{ contains(env.TAG, '-') }}
